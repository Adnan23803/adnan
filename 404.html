<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Adnan Adamou</title>
  <link rel="icon" href="images/logo.jpg" type="image/jpeg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="lang-fr">

  <header class="site-header">
    <div class="nav">
      <a href="/" class="brand">
        <img src="images/logo.jpg" alt="Data Solution" class="brand-logo">
        <span>Adnan Adamou</span>
      </a>
      <ul class="nav-links" style="position:static; padding:0; transform:none; opacity:1; pointer-events:auto; flex-direction:row; border:none;">
        <li class="lang-toggle-wrapper">
          <div class="lang-toggle" role="group" aria-label="Language">
            <button data-lang="fr" aria-pressed="true">FR</button>
            <button data-lang="en" aria-pressed="false">EN</button>
          </div>
        </li>
      </ul>
    </div>
  </header>

  <section class="hero" style="text-align:center; min-height:65vh; display:flex; align-items:center;">
    <div class="container">
      <div style="font-family:var(--serif); font-size:clamp(8rem, 22vw, 16rem); line-height:0.9; color:var(--terracotta); font-style:italic; font-variation-settings:'opsz' 144, 'SOFT' 100, 'wght' 300;">
        404
      </div>
      <h2 style="margin:1rem 0 1.5rem;">
        <span lang="fr">Cette page s'est <em style="font-style:italic; color:var(--terracotta);">égarée</em>.</span>
        <span lang="en">This page <em style="font-style:italic; color:var(--terracotta);">wandered off</em>.</span>
      </h2>
      <p class="lead" style="margin: 0 auto 2rem;">
        <span lang="fr">Mais la donnée principale, elle, est intacte.</span>
        <span lang="en">But the main dataset is, fortunately, intact.</span>
      </p>
      <a href="/" class="btn btn-primary">
        <span lang="fr">Retour à l'accueil</span>
        <span lang="en">Back home</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </section>

  <script src="js/main.js"></script>
</body>
</html>
